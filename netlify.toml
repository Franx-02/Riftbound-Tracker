[build]
  command = "npm run build"
  publish = "dist/riftbound-app/browser"

[build.environment]
  NODE_VERSION = "22"

# netlify dev: Angular en 4200 y Netlify delante en 8888, con /api/* servido por las funciones.
# Puertos explícitos para que no dependan de la variable PORT del entorno.
[dev]
  command = "npx ng serve --port 4200"
  targetPort = 4200
  port = 8888
  framework = "#custom"

[functions]
  directory = "netlify/functions"

# SPA: cualquier ruta que no sea un fichero ni /api la sirve Angular.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Los ficheros de Angular llevan un hash en el nombre: se pueden cachear para siempre.
[[headers]]
  for = "/chunk-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/main-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/polyfills-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/styles-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify sirve .webmanifest como application/octet-stream; con el tipo correcto
# el navegador ofrece instalar la PWA sin avisos.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
